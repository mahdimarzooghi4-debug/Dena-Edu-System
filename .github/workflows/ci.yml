name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # Bootstrap-only; restore read after committing generated lockfile.

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use npm 11
        run: npm install --global npm@11 --no-audit --no-fund
      - name: Generate bootstrap lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Commit bootstrap lockfile to its own branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/bootstrap-dena-stack'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: commit generated npm package-lock"
            git push origin HEAD:chore/bootstrap-dena-stack
          fi
      - name: Install deterministically
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
