name: Android Student APK

on:
  pull_request:
    paths:
      - "android-student/**"
      - ".github/workflows/android-student.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: JVM tests and build unsigned Android debug APK
        run: gradle -p android-student --no-daemon testDebugUnitTest assembleDebug
      - name: Publish Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dena-student-android-debug-${{ github.sha }}
          path: android-student/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
